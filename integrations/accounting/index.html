<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#153f3b">
  <meta name="description" content="会计：以课程课件为线索的会计学习室。完整知识地图、中文讲解与英文自测，随时学习，随处记录。">
  <title>会计 · Accounting</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#main">跳到学习内容</a>
  <aside class="sidebar" aria-label="主导航">
    <a class="brand" href="#map"><span class="brand-mark" aria-hidden="true">会</span><span>会计<small>ACCOUNTING</small></span></a>
    <div class="side-label">我的学习空间</div>
    <nav>
      <a href="#map" data-nav="map"><span aria-hidden="true">▦</span>知识地图</a>
      <a href="#continue" data-nav="continue"><span aria-hidden="true">↗</span>继续学习</a>
      <a href="#review" data-nav="review"><span aria-hidden="true">↻</span>错题复习<span id="review-count" class="count"></span></a>
      <a href="#notes" data-nav="notes"><span aria-hidden="true">▤</span>我的记录<span id="notes-count" class="count"></span></a>
    </nav>
    <div class="side-bottom"><p>理解每一笔业务，<br>连接每一张报表。</p><button class="text-btn" data-action="settings">数据与备份 ↗</button><span class="local-status" id="save-status" role="status">本机保存</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><span id="breadcrumb">学习空间 / 知识地图</span><div><button class="language-toggle" id="language-toggle" data-action="language" aria-label="Switch to English">English</button><button class="quick-note" data-action="quick-note">＋ 随手记</button><button class="icon-btn" data-action="settings" aria-label="数据与备份">⇅</button></div></header>
    <main id="main" tabindex="-1"><div class="loading">正在展开知识地图…</div></main>
    <footer>会计 · Accounting <span>按自己的节奏，把知识连起来。</span></footer>
  </div>
  <dialog id="note-dialog" aria-labelledby="note-title"><form id="note-form"><div class="dialog-heading"><h2 id="note-title">记下这一刻</h2><button type="button" class="icon-btn" data-action="close-note" aria-label="关闭记录窗口">×</button></div><p id="note-context" class="muted"></p><input type="hidden" name="id"><label>记录类型<select name="kind"><option>理解</option><option>疑问</option><option>课堂补充</option><option>随手记</option></select></label><label>关联知识点<select name="nodeId"></select></label><label>内容<textarea name="body" rows="7" maxlength="30000" placeholder="用自己的话写下来，也可以先留下一个问题。" required></textarea></label><p class="small muted" id="note-autosave" role="status">输入后自动保存在本机。</p><button class="primary" type="submit">保存并关闭</button></form></dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title">数据与备份</h2><button class="icon-btn" data-action="close-settings" aria-label="关闭数据与备份">×</button></div><div id="settings-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>请启用 JavaScript，以使用知识地图、学习内容和本机记录。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
